[en]
name = "OpenWhispr"
title = "VoxKey vs OpenWhispr: Mac Dictation Compared"
description = "Compare VoxKey vs OpenWhispr: two free, open-source dictation apps. Explore local processing, transcript history, platform support, and workflow differences."
eyebrow = "TWO OPEN-SOURCE APPS"
lead = "Free local dictation on both sides, with a real choice about history and platforms."
card = "Free local dictation on both sides, with a real choice about history and platforms."
glance = { price = "Free local dictation", processing = "Local by default", useful_for = "Open source + more platforms" }
choose_voxkey = "Choose VoxKey if you want a native Mac dictation utility that does not keep a transcript archive. Safety Net retains a result for recovery when delivery cannot be confirmed; confirmed delivery clears it."
choose_other = "Choose OpenWhispr if you want free, open-source local dictation on Mac, Windows, or Linux, with optional cloud providers and a wider set of meeting and agent features."
note = "OpenWhispr defaults to local processing and audio retention is off by default. Its policy says transcribed text is stored in a local database. VoxKey’s distinction is no dictation history, not exclusive access to private or free transcription."

[[en.rows]]
label = "Cost"
voxkey = "Free; MIT-licensed app source. Model terms are separate."
other = "Unlimited local dictation free; paid plans add cloud and other features."

[[en.rows]]
label = "Processing"
voxkey = "Local only after model downloads; update checks use the internet."
other = "Local by default; own API keys or managed cloud optional."

[[en.rows]]
label = "Platforms"
voxkey = "Apple Silicon Mac, macOS 26 or later."
other = "Mac, Windows, Linux; iOS companion offered with Pro."

[[en.rows]]
label = "Workflow"
voxkey = "Dictation into text fields, vocabulary hints, Safety Net recovery."
other = "Local transcript history; meeting and agent features."

