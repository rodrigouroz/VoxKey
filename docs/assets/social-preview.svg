<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Colors mirror docs/styles.css tokens: canvas, demo-surface, border, ink, muted, green, demo-ink. -->
  <rect width="1200" height="630" fill="#f4f5f0"/>
  <rect x="880" width="320" height="630" fill="#e5ebdd"/>
  <path d="M64 128H1136" stroke="#dce3da"/>
  <image href="voxkey-icon.png" x="64" y="48" width="48" height="48"/>
  <text x="124" y="81" fill="#202d28" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="600" letter-spacing="-1">VoxKey</text>
  <text x="64" y="198" fill="#356040" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2.5">YOUR VOICE. YOUR MAC.</text>
  <text x="61" y="297" fill="#202d28" font-family="'New York', Georgia, serif" font-size="76" letter-spacing="-3">A little less typing.</text>
  <text x="61" y="386" fill="#202d28" font-family="'New York', Georgia, serif" font-size="76" letter-spacing="-3">A lot more <tspan fill="#356040" font-style="italic">you.</tspan></text>
  <text x="64" y="455" fill="#5d6c64" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="24">Local dictation for your Mac. Nothing you say leaves it.</text>
  <text x="64" y="558" fill="#356040" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17">100% local. Free forever. Fully open source.</text>
  <!-- keycap: the brand mark, lime on paper -->
  <rect x="932" y="236" width="216" height="164" rx="24" fill="#8fbf62"/>
  <rect x="932" y="225" width="216" height="164" rx="24" fill="#a9dc78"/>
  <rect x="944" y="237" width="192" height="140" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>
  <text x="959" y="354" fill="#1f3321" font-family="'New York', Georgia, serif" font-size="45">fn</text>
  <g stroke="#1f3321" stroke-width="6" stroke-linecap="round"><path d="M1036 286v17M1050 273v43M1064 259v71M1078 275v39M1092 285v19"/></g>
  <text x="979" y="447" fill="#51604b" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2">HOLD. SPEAK.</text>
  <text x="966" y="469" fill="#51604b" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2">KEEP WRITING.</text>
</svg>
