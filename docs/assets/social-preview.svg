  <text x="61" y="386" fill="#20382b" font-family="Georgia, serif" font-size="76" letter-spacing="-3">A lot more <tspan fill="#356040" font-style="italic">you.</tspan></text>
  <text x="64" y="455" fill="#5e6c61" font-family="Arial, sans-serif" font-size="24">Local dictation for your Mac.</text>
  <text x="64" y="558" fill="#356040" font-family="Arial, sans-serif" font-size="17">100% local. Free forever. Fully open source.</text>
